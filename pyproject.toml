[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "martins-algorithm"
version = "1.0.0"
description = "Crypto Asset Recovery & Opportunity Detection Engine"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["."]
include = ["martin_core*", "martin_api*", "data*", "agents*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths   = ["tests"]

[tool.ruff]
target-version = "py311"
line-length    = 100
